name: Bug report
description: Something is not working as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Field definition (`->translatable(...)`), text typed, target language, mode.
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Package, Filament, Laravel, PHP (e.g. 0.2.0 / 4.1 / 12.x / 8.3)
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser
      placeholder: Chrome 130 / Safari 18 / ...
  - type: textarea
    id: logs
    attributes:
      label: Console / log output
      render: shell
